// The Profile: the run as star plots (HeroStatsProfile in the game) and on Per level the
// completion table. Its data is made by the game: D.profiles[level][who], who the column, the party last.
const PARTY_SHAPE = '#7fa6e6';
const shapeColour = w => w === N ? PARTY_SHAPE : COLOUR(w);
function starSvg(s) {
  const n = s.axes.length, W = 420, H = 330, cx = W / 2, cy = H / 2;
  // The names at the sides stay inside the picture: long names make the star smaller
  let R = 110;
  for (let a = 0; a < n; a++) {
    const slant = Math.abs(Math.cos(-Math.PI / 2 + 2 * Math.PI * a / n));
    if (slant >= 0.05) R = Math.min(R, (W / 2 - 6 - s.axes[a].length * 6.9) / slant - 14);
  }
  R = Math.max(R, 50);
  const reach = v => v === null || s.outer <= s.centre ? 0 : Math.max(0, Math.min(1, (v - s.centre) / (s.outer - s.centre)));
  const pt = (a, r) => { const t = -Math.PI / 2 + 2 * Math.PI * a / n; return [cx + R * r * Math.cos(t), cy + R * r * Math.sin(t)]; };
  const poly = r => Array.from({length: n}, (_, a) => pt(a, r).map(x => x.toFixed(1)).join(',')).join(' ');
  let out = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.title)}">`;
  for (const [v] of s.rings) out += `<polygon points="${poly(reach(v))}" fill="none" stroke="#3a3d46"/>`;
  out += `<polygon points="${poly(1)}" fill="none" stroke="#3a3d46"/>`;
  if (s.even !== null && s.even > 0) out += `<polygon points="${poly(reach(s.even))}" fill="none" stroke="#9aa0ad" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  for (let a = 0; a < n; a++) { const [x, y] = pt(a, 1); out += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#3a3d46"/>`; }
  for (const [v, label] of s.rings) if (label) { const [x, y] = pt(0, reach(v)); out += `<text x="${x + 4}" y="${y + 11}" font-size="10" fill="#8a8d98">${esc(label)}</text>`; }
  if (s.edge) { const [x, y] = pt(0, 1); out += `<text x="${x + 4}" y="${y + 11}" font-size="10" fill="#8a8d98">${esc(s.edge)}</text>`; }
  const bright = s.shapes.filter(h => !h.faint).length;
  for (const h of s.shapes) {
    const c = shapeColour(h.who), pts = h.values.map((v, a) => pt(a, reach(v)));
    out += `<polygon points="${pts.map(p => p.map(x => x.toFixed(1)).join(',')).join(' ')}" fill="${c}" fill-opacity="${h.faint ? 0.06 : bright === 1 ? 0.22 : 0.10}" stroke="${c}" stroke-opacity="${h.faint ? 0.45 : 1}" stroke-width="${h.faint ? 1 : 2}" stroke-linejoin="round"/>`;
    if (!h.faint) for (const [x, y] of pts) out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${c}"/>`;
  }
  const single = bright === 1 ? s.shapes.find(h => !h.faint) : null;
  for (let a = 0; a < n; a++) {
    const [x, y] = pt(a, 1.17), dx = x - cx;
    const anchor = Math.abs(dx) < 8 ? 'middle' : dx > 0 ? 'start' : 'end';
    const yy = y + (Math.abs(dx) >= 8 ? 4 : y < cy ? (single ? -10 : -2) : 10);
    // The name dotted underneath, as any label with a hovertext; the tip is the game's own text
    const tw = s.axes[a].length * 6.9, tx = anchor === 'middle' ? x - tw / 2 : anchor === 'end' ? x - tw : x;
    out += `<g${s.tips && s.tips[a] ? tipOf(esc(s.tips[a]).replace(/\n/g, '<br>')) : ''} style="cursor:help"><text x="${x.toFixed(1)}" y="${yy.toFixed(1)}" font-size="11.5" fill="#d8d8d8" text-anchor="${anchor}">${esc(s.axes[a])}</text>` +
      `<line x1="${tx.toFixed(1)}" y1="${(yy + 3).toFixed(1)}" x2="${(tx + tw).toFixed(1)}" y2="${(yy + 3).toFixed(1)}" stroke="#5a5d68" stroke-dasharray="1 2"/>`;
    if (single) out += `<text x="${x.toFixed(1)}" y="${(yy + 13).toFixed(1)}" font-size="11.5" fill="#fff" font-weight="600" text-anchor="${anchor}">${esc(single.texts[a])}</text>`;
    out += '</g>';
  }
  return out + '</svg>';
}
function starLegend(s) {
  if (s.shapes.length < 2) return '';
  const order = s.shapes.slice().sort((a, b) => a.who - b.who);
  return `<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">${order.map(h =>
    `<span style="display:flex;gap:6px;align-items:center${h.faint ? ';color:var(--dim)' : ''}"><span style="width:10px;height:10px;border-radius:50%;background:${shapeColour(h.who)}${h.faint ? ';opacity:.45' : ''}"></span>${esc(whoName(h.who))}</span>`).join('')}</div>`;
}
const pct = v => v === null ? '-' : Math.round(v * 100) + '%';
function profilePage() {
  const all = D.profiles && D.profiles[String(st.per ? -1 : st.level)];
  const p = all && all[st.who];
  if (!p) return '<div class="note">No profile for this level.</div>';
  if (st.per) {
    const head = ['Explored', 'Items', 'Monsters', 'Doors', 'Switches'].map((a, i) => `<th><span class="tip"${tipOf(esc(D.completionHelps[i]))}>${a}</span></th>`).join('');
    const rows = p.table.map(r => {
      const run = r[0] === -1;
      const cells = r.slice(1).map(v => {
        const t = v === null ? 0 : v, shade = `rgb(${Math.round(0x2f + (0x3f - 0x2f) * t)},${Math.round(0x32 + (0x63 - 0x32) * t)},${Math.round(0x3a + (0xa8 - 0x3a) * t)})`;
        return `<td class="c${v !== null && v < 0.5 ? ' low' : ''}" style="${run || v === null ? '' : 'background:' + shade}">${pct(v)}</td>`;
      }).join('');
      return `<tr${run ? ' style="background:#272930;font-weight:600"' : ''}><td class="l" onclick="set({per:false,level:${r[0]}})">${run ? 'Whole run' : 'Level ' + r[0]}</td>${cells}</tr>`;
    }).join('');
    return `<h3 style="margin:10px 0 4px">Completion, level by level</h3><div class="note">Each cell: what the party found on that level, of all the level holds. Under half in orange. Click a level to pick it.</div><div style="overflow-x:auto"><table class="comp"><tr><th style="text-align:left">Level</th>${head}</tr>${rows}</table></div>`;
  }
  const stars = p.stars.filter((s, i) => i !== 4 || p.roles);
  const cards = stars.map(s => `<div class="pf-card"><h3>${esc(s.title)}</h3><div class="pf-cap">${esc(s.caption)}</div>${starSvg(s)}${starLegend(s)}</div>`).join('');
  return `<div class="pf-cards">${cards}</div>`;
}

function draw() {
  TIPS = [];
  hideTip(true);
  if (st.level !== -1 && !D.views[String(st.level)]) st.level = -1;
  frame();
  let html;
  if (N === 0 && D.levels.length === 0) html = '<div class="note">No statistics yet.</div>';
  else html = st.topic === CHAMPIONS ? championsPage() : st.topic === PROFILE ? profilePage() : st.per ? perLevel() : topicPage();
  document.getElementById('view').innerHTML = html;
  fit();
  writeLink();
}

// ---- following the page's width (the window does the same in HeroStatsLayout) ----
// How many of count equal boxes stand in a row: as many as fit, but four never three and one
function across(count, available, smallest, gap) {
  let fits = 1;
  while (fits < count && (fits + 1) * smallest + fits * gap <= available) fits++;
  return count === 4 && fits === 3 ? 2 : fits;
}
// The bar cells and the cells worked out from others (Rate, Avg) get a class by column, their
// headers too, so a narrow table can leave the whole column out
function tagColumns(table) {
  const rows = [...table.rows], head = rows.find(r => !r.classList.contains('groups'));
  if (!head) return;
  const bars = new Set(), derived = new Set();
  rows.forEach(r => [...r.cells].forEach(c => { if (c.classList.contains('bar') || c.classList.contains('whobar')) bars.add(c.cellIndex); }));
  [...head.cells].forEach(c => { if (/^(Rate|Avg)\b/.test(c.textContent.trim())) derived.add(c.cellIndex); });
  rows.forEach(r => { if (r.cells.length !== head.cells.length) return;
    bars.forEach(i => r.cells[i].classList.add('c-bar')); derived.forEach(i => r.cells[i].classList.add('c-der')); });
}
// A heading over a group of columns spans those of them the table still shows (a narrow one
// leaves out its bar and its Rate columns)
function spanGroups(table) {
  const groups = table.querySelector('tr.groups'), head = groups && groups.nextElementSibling;
  if (!groups) return;
  const shown = [...head.cells].map(c => getComputedStyle(c).display !== 'none');
  for (const th of groups.cells) {
    let n = 0;
    for (let i = +th.dataset.from; i <= +th.dataset.to; i++) if (shown[i]) n++;
    th.colSpan = Math.max(n, 1);
    th.style.display = n ? '' : 'none';
  }
}
function fitTables(view) {
  view.querySelectorAll('.wide').forEach(w => {
    const table = w.querySelector('table');
    if (!table) return;
    // What a table too wide gives up, in this order (HeroStatsLayout_FitTable): its bar, the
    // champions' names, half its padding, the worked-out columns, the label's single line, the
    // long form of big numbers; then it scrolls
    // (the inventory list's Kinetic goes before anything else)
    const steps = [...(table.querySelector('.c-kin') ? ['nokin'] : []), 'nobar', 'dots', 'tight', 'noder', 'wrap', 'short', 'scrolls'];
    w.classList.remove('nokin');
    w.classList.remove(...steps);
    for (const step of steps) {
      spanGroups(table);
      if (table.offsetWidth <= w.clientWidth + 1) break;
      w.classList.add(step);
    }
    spanGroups(table);
    // A header that shows the dot alone names its champion when hovered
    table.querySelectorAll('th[data-name]').forEach(th => { if (w.classList.contains('dots')) th.title = th.dataset.name; else th.removeAttribute('title'); });
  });
}
function fit() {
  const view = document.getElementById('view'), top = document.getElementById('top');
  // The row of level numbers that does not fit becomes the stepper
  const seg = top.querySelector('.seg');
  if (seg) {
    const tooWide = () => top.querySelector('.seg').offsetWidth > top.clientWidth - 20;
    if (st.compact) { st.compact = false; frame(); }
    if (tooWide()) { st.compact = true; frame(); }
  }
  const style = getComputedStyle(view);
  const width = view.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  view.querySelectorAll('table').forEach(tagColumns);
  // Sections side by side when each fits in half the page at its full width: in their order, the
  // first ones on the left, split where the taller column is least tall (HeroStatsLayout_Flow)
  const secs = view.querySelector('.secs');
  if (secs) {
    const all = [...secs.children];
    view.classList.add('measure');
    // A sortable table has the arrow in one header, whichever: its room is added once
    const arrow = 16;
    const needs = all.map(s => Math.max(0, ...[...s.querySelectorAll('table')].map(x => x.offsetWidth + (x.querySelector('th.sort') ? arrow : 0))));
    view.classList.remove('measure');
    if (all.length >= 2 && needs.every(n => n <= (width - 22) / 2)) {
      const heights = all.map(s => s.offsetHeight);
      const cols = [document.createElement('div'), document.createElement('div')], total = sum(heights);
      let split = all.length, best = total, left = 0;
      for (let k = 1; k < all.length; k++) {
        left += heights[k - 1];
        const taller = Math.max(left, total - left);
        if (taller <= best) { best = taller; split = k; }
      }
      all.forEach((s, i) => cols[i < split ? 0 : 1].appendChild(s));
      secs.classList.add('two');
      secs.append(cols[0], cols[1]);
    }
  }
  fitTables(view);
  view.querySelectorAll('.tiles').forEach(g => { g.style.gridTemplateColumns = `repeat(${across(g.children.length, width, 150, 8)},1fr)`; });
  view.querySelectorAll('.cards').forEach(g => { g.style.gridTemplateColumns = `repeat(${across(g.children.length, width, 230, 8)},minmax(0,480px))`; });
  view.querySelectorAll('.lcards').forEach(g => {
    const n = across(g.children.length, width, 290, 10);
    g.style.gridTemplateColumns = `repeat(${n},minmax(0,480px))`;
    g.classList.toggle('full', n === g.children.length);   // all in one row: the cards show attributes and inventory
  });
  view.querySelectorAll('.facts').forEach(g => { g.style.gridTemplateColumns = `repeat(${across(g.children.length, width, 230, 10)},minmax(0,1fr))`; });
  view.querySelectorAll('.topics').forEach(g => { g.style.gridTemplateColumns = width >= 528 ? '1fr 1fr' : '1fr'; });
}
let fitTimer = 0;
addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(draw, 80); });
// The column guide: the cells and the header of the column under the pointer
let hot = [];
document.addEventListener('mousemove', e => {
  hot.forEach(c => c.classList.remove('hc'));
  hot = [];
  const cell = e.target.closest ? e.target.closest('#view td') : null;
  if (!cell || cell.cellIndex === 0) return;
  const table = cell.closest('table'), n = cell.parentNode.cells.length;
  [...table.rows].forEach(r => { if (r.cells.length === n && r.cells[cell.cellIndex]) { r.cells[cell.cellIndex].classList.add('hc'); hot.push(r.cells[cell.cellIndex]); } });
});

// The view as a link: #who=Party&topic=Records&level=run (level: run, a number or per; side=1 for
// the champions side by side). Read when the page opens, from the hash or the query string, and
// written back after every change, so the address bar can be copied.
const same = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
function readLink() {
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const get = k => h.has(k) ? h.get(k) : q.get(k);
  const who = get('who'), topic = get('topic'), level = get('level'), side = get('side');
  if (who !== null) {
    const i = same(who, 'party') ? N : H.findIndex(c => same(c.name, who));
    if (i >= 0) st.who = i; else if (/^\d+$/.test(who) && +who <= N) st.who = +who;
  }
  if (topic !== null) {
    const i = same(topic, 'champions') ? CHAMPIONS : same(topic, 'profile') ? PROFILE : TOP.findIndex(t => same(t.label, topic));
    if (i >= 0) st.topic = i;
  }
  if (level !== null) {
    if (same(level, 'per')) st.per = true;
    else if (same(level, 'run') || same(level, 'whole') || same(level, 'whole run')) { st.per = false; st.level = -1; }
    else if (/^\d+$/.test(level) && D.views[level]) { st.per = false; st.level = +level; }
  }
  if (side !== null) st.side = side === '1';
}
function writeLink() {
  const h = new URLSearchParams();
  h.set('who', whoName(st.who));
  h.set('topic', st.topic === CHAMPIONS ? 'Champions' : st.topic === PROFILE ? 'Profile' : TOP[st.topic].label);
  if (st.topic !== CHAMPIONS) {
    h.set('level', st.per ? 'per' : st.level === -1 ? 'run' : st.level);
    if (st.per && st.side) h.set('side', '1');
  }
  try { history.replaceState(null, '', '#' + h.toString().replace(/\+/g, '%20')); } catch (e) {}
}
readLink();
draw();
</script>
