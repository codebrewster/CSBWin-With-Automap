; = Internal timer in ms
[settings]
# Not sure this timer has any use these days, apparently it was used for an old version of CSBwin when the linux version could become very slow...
# The speed menu doesn't control the speed using this
timer = 10
fullscreen = 0
# window width and height, a good default for most modern screens x4 size (1280x800).
width = 1280
height = 800
# This is the last size of the window before going fullscreen. Usefull in case settings are saved in fullscreen mode to allow to retrieve the last window size in next session
winx = 1280
winy = 1280
# gameSpeed : 4 is normal
gameSpeed = 4
show_coords = 1
monsters_vulnerable_on_attack = 0
nostalgia_mode = 0
dungeonName = dungeon.dat
graphicName = graphics.dat
launcher_power = 4
filter_dsa_door_sound = 1
experimental_overlay = 1

[keys]
; = key translations
; =
; = scan  <PC scan code>    <ATARI key code>
; = mscan <PC VirtualKey>   <mouseX> <mouseY> <R/L>
; =
; = *******   IMPORTANT  NOTE   *********
; =
; = !!!  Every number in this file is hexadecimal !!!!!
; =
; =
; = Scan codes are processed in OnKeyDown.
; = Generally this is used to process non-ascii keys.
; = Key codes are processed by OnChar.
; = ASCII codes are generally specified here.
; = mscan codes are used to translate keypresses to
; = equivalent mouse clicks.  The x- and y-coordinates
; = are relative to the entire 320 by 200 screen.  The
; = R or L is used to designate which mouse button is
; = pressed.
; =
; =
; = escape = Freeze Game
scan01 = 29 1b
; =
; = 'k' = move forward
scan02 = e 480000
; = Keypad '8' = move forward
scan03 = 60 480000
; =
; = 'l' = turn right
scan04 = f 470000
; = Keypad '9' = turn right
scan05 = 61 470000
; =
; = 'j' = turn left
scan06 = d 520000
; = Keypad '7' = turn left
scan07 = 5f 520000
; =
; = '.' = move right
scan08 = 36 4d0000
; = Keypad '6' = move right
scan09 = 5e 4d0000
; =
; = 'm' = move left
scan10 = 11 4b0000
; = Keypad '4' = move left
scan11 = 5c 4b0000
; =
; = ',' = move backward
scan12 = 10 500000
; = Keypad '5' = move backward
scan13 = 5d 500000
; =
; = SDL 'q' = character 1 weapon / first attack
mscan01 = 14 f0 5c L
; = SDL 'w' = character 2 weapon / first attack
mscan02 = 1a 104 5c L
; = SDL 'e' = character 3 weapon / first attack
